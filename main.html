<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Center</title>
    <style>
        :root {
            --bg: #0f172a; --panel: #111827; --panel-soft: #1f2937;
            --accent: #22c55e; --accent-2: #3b82f6; --text: #e5e7eb;
            --muted: #94a3b8; --danger: #f87171; --warning: #fbbf24;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: grid; place-items: center;
            background: linear-gradient(135deg, #020617, var(--bg));
            color: var(--text); font-family: Arial, sans-serif;
        }
        .container {
            width: min(92vw, 500px); background: rgba(17, 24, 39, 0.96);
            border: 1px solid rgba(148, 163, 184, 0.2); border-radius: 22px; 
            padding: 30px; box-shadow: 0 22px 60px rgba(0, 0, 0, 0.35); text-align: center;
        }
        h1 { margin-top: 0; margin-bottom: 30px; font-size: 2.2rem; color: var(--accent-2); }
        .game-card {
            display: flex; flex-direction: column; align-items: center;
            background: var(--panel-soft); padding: 20px; border-radius: 16px;
            text-decoration: none; color: white; transition: transform 0.2s, background 0.2s;
            margin-bottom: 15px; border: 2px solid transparent;
        }
        .game-card:hover {
            transform: translateY(-5px); background: #2d3748; border-color: var(--accent);
        }
        .game-card h2 { margin: 0 0 10px 0; color: var(--accent); }
        .game-card p { margin: 0; color: var(--muted); font-size: 0.9rem; }
        .game-card-disabled {
            display: flex; flex-direction: column; align-items: center;
            background: rgba(31, 41, 55, 0.5); padding: 20px; border-radius: 16px;
            color: var(--muted); margin-bottom: 15px; border: 2px dashed var(--muted);
            cursor: not-allowed;
        }
        .game-card-disabled h2 { margin: 0 0 10px 0; color: var(--muted); }
        .game-card-disabled p { margin: 0; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Game Center</h1>
        
        <!-- เกมที่ 1: แฟนพันธุ์แท้ -->
        <a href="/fanpantae" class="game-card">
            <h2>🎯 เกมแฟนพันธุ์แท้</h2>
            <p>แข่งขันตอบคำถาม ใครเร็วกว่าคนนั้นชนะ! (Multiplayer)</p>
        </a>

        <!-- เกมที่ 2: จับคู่ไพ่ประกันสังคม -->
        <a href="/matchgame" class="game-card">
            <h2>🃏 จับคู่ไพ่ประกันสังคม</h2>
            <p>ทดสอบความจำ เล่นคนเดียวหรือแข่งกันหลายคนก็ได้!</p>
        </a>
        
        <div class="game-card-disabled">
            <h2>🔜 เกมใหม่ (เร็วๆ นี้)</h2>
            <p>กำลังอยู่ในช่วงพัฒนา...</p>
        </div>
    </div>
</body>
</html>
